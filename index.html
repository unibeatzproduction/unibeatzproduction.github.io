<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnibeatzProduction</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background: url('https://images.unsplash.com/photo-1588776814546-64a3b4f0bba1?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Overlay for darkened effect */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 900px;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      color: #00f5ff;
      text-shadow: 0 0 10px #00f5ff;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      color: #ccc;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 20px 40px;
      font-size: 1rem;
      color: #fff;
      border: 2px solid #00f5ff;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: 0.3s;
      border-radius: 10px;
      box-shadow: 0 0 10px #00f5ff;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(0, 245, 255, 0.2);
      transform: rotate(45deg);
      transition: all 0.5s;
    }

    .btn:hover::before {
      top: 0;
      left: 0;
    }

    .btn:hover {
      box-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff inset;
    }

    /* Animated lightning effect */
    @keyframes lightning {
      0%, 100% { text-shadow: 0 0 10px #00f5ff; }
      50% { text-shadow: 0 0 20px #00f5ff, 0 0 30px #00f5ff; }
    }

    .btn {
      animation: lightning 2s infinite;
    }

    /* Responsive */
    @media(max-width: 600px) {
      h1 { font-size: 2rem; }
      .btn { padding: 15px 30px; font-size: 0.9rem; }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>UniBeatWorld</h1>
    <p>Built From Pressure</p>
    <div class="buttons">
      <a href="https://your-preview-link.com" class="btn" target="_blank">Preview</a>
      <a href="https://unibeatzworld-beats.com" class="btn" target="_blank">Beats & Songs</a>
      <a href="https://unifreestyle-app.com" class="btn" target="_blank">Freestyle Battle App</a>
    </div>
  </div>

  <!-- Optional: Add DJ/MIDI controller images as background decorations -->
  <script>
    // Optional: Simple moving background particles or lightning streaks could be added here later
  </script>
</body>
</html>
