<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Enhanced Website</title>
    <style>
        /* CSS for Electric Particle Background */ 
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            animation: particle-animation 2s infinite ease-out;
        }

        @keyframes particle-animation {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)); opacity: 0; }
        }

        /* Button Styles */ 
        .btn {
            display: inline-block;
            padding: 14px 36px;
            border: 2px solid #ff008c;
            background-color: transparent;
            color: #ff008c;
            text-transform: uppercase;
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            color: white;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, #ff008c, #ff8a00);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
            z-index: 0;
        }

        .btn:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .coming-soon {
            display: inline-block;
            padding: 10px 20px;
            background: #ff008c;
            color: white;
            border-radius: 5px;
            font-size: 18px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <h1>Welcome to the Enhanced Website</h1>
    <a href="#" class="btn">Explore</a>
    <span class="coming-soon">Coming Soon</span>
    <script src="particles.js"></script>
    <script>
        // JavaScript for generating particles
        for (let i = 0; i < 100; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            document.body.appendChild(particle);
            particle.style.setProperty('--x', Math.random() * 200 - 100 + 'px');
            particle.style.setProperty('--y', Math.random() * 200 - 100 + 'px');
        }
    </script>
</body>
</html>
