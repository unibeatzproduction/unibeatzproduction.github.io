<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unibeatz Production</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        .electric-streak {
            animation: electric 1s infinite;
        }
        @keyframes electric {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .button-animation {
            transition: all 0.3s ease;
        }
        .button-animation:hover {
            transform: scale(1.1);
            background-color: #ffcc00;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <header>
        <h1 class="electric-streak">Welcome to Unibeatz Production</h1>
        <button class="button-animation">Explore</button>
    </header>
    <section>
        <h2>Coming Soon</h2>
        <div class="coming-soon-badge">Stay Tuned!</div>
    </section>
    <script>
        particlesJS.load('particles-js', 'particles.json', function() {
            console.log('callback - particles.js config loaded');
        });
    </script>
</body>
</html>
