<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UniBeatz Radio Built From Pressure">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#071b2d"/>
      <stop offset="0.58" stop-color="#05070d"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7b5a10"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#F0C040"/>
    </linearGradient>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="50" fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.35"/>
  <rect x="56" y="56" width="400" height="400" rx="42" fill="none" stroke="#00AAFF" stroke-width="2" opacity="0.18"/>

  <!-- Safe centered logo group: leaves roughly 95px padding on all important edges -->
  <g filter="url(#softShadow)">
    <path d="M148 122 L190 154 L225 120 L256 160 L287 120 L322 154 L364 122 L346 194 H166 Z" fill="url(#gold)" opacity="0.96"/>
    <circle cx="190" cy="118" r="9" fill="#F0C040"/>
    <circle cx="256" cy="112" r="10" fill="#F0C040"/>
    <circle cx="322" cy="118" r="9" fill="#F0C040"/>
  </g>

  <g filter="url(#blueGlow)">
    <path d="M258 142 L230 244 H272 L238 362 L312 226 H270 L292 142 Z" fill="#40D0FF" opacity="0.95"/>
    <path d="M150 254 C186 214 326 214 362 254" fill="none" stroke="#40D0FF" stroke-width="10" stroke-linecap="round" opacity="0.86"/>
    <path d="M164 282 C198 319 314 319 348 282" fill="none" stroke="#C9A84C" stroke-width="10" stroke-linecap="round" opacity="0.82"/>
    <circle cx="256" cy="266" r="44" fill="none" stroke="#F0C040" stroke-width="10" opacity="0.9"/>
    <circle cx="256" cy="266" r="22" fill="#050507" stroke="#40D0FF" stroke-width="6"/>
  </g>

  <text x="256" y="388" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="34" fill="#F0C040" letter-spacing="2">UNIBEATZ</text>
  <text x="256" y="424" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="25" fill="#F0EDE8" letter-spacing="5">RADIO</text>
  <text x="256" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#40D0FF" letter-spacing="3">BUILT FROM PRESSURE</text>
</svg>
