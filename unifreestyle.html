```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Freestyle Battle</title>

<style>
body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Orbitron,sans-serif;
    overflow:hidden;
}

#page-livebattle{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:10px;
    box-sizing:border-box;
    background:
    radial-gradient(circle at top,#0f1725 0%,#050505 60%);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.top-bar h1{
    color:#00aaff;
    font-size:28px;
    margin:0;
}

.live-room-shell{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.live-status-card{
    background:#111827;
    border:1px solid rgba(0,170,255,.3);
    border-radius:12px;
    padding:12px;
}

.live-room-title{
    font-size:20px;
    margin-bottom:5px;
}

.live-stage{
    flex:1;
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:10px;
}

.dj-section{
    display:flex;
    justify-content:center;
}

.dj-video{
    width:420px;
    height:220px;
    background:#111;
    border:2px solid #00aaff;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.artist-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.artist-box{
    background:#111;
    border:2px solid #00aaff;
    border-radius:12px;
    min-height:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.artist-label{
    position:absolute;
    top:10px;
    left:10px;
    color:#00aaff;
    font-size:18px;
}

.bottom-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.panel{
    background:#111827;
    border:1px solid rgba(0,170,255,.25);
    border-radius:10px;
    padding:10px;
    min-height:100px;
}

.live-controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.btn-gold{
    background:#c99700;
}

.btn-blue{
    background:#0077ff;
}

.btn-red{
    background:#d62828;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:10px;
}

@media(max-width:900px){
    .artist-grid{
        grid-template-columns:1fr;
    }

    .bottom-row{
        grid-template-columns:1fr;
    }

    body{
        overflow:auto;
    }
}
</style>
</head>

<body>

<div id="page-livebattle">

<div class="top-bar">
<h1>🔥 Live Battle</h1>

<div class="live-controls">
<button class="btn btn-gold" onclick="joinRole('artist')">Join Artist</button>
<button class="btn btn-blue" onclick="joinRole('dj')">Join DJ</button>
<button class="btn btn-blue" onclick="joinRole('viewer')">Watch</button>
<button class="btn btn-red" onclick="leaveBattle()">Leave</button>
</div>
</div>

<div class="live-room-shell">

<div class="live-status-card">
<div class="live-room-title">Uni Freestyle Battle Arena</div>
<div id="liveStatus">Status: Waiting...</div>
</div>

<div class="live-stage">

<div class="dj-section">
<div class="dj-video" id="djVideoBox">
DJ CAMERA
</div>
</div>

<div class="artist-grid">

<div class="artist-box" id="artist1VideoBox">
<div class="artist-label">ARTIST 1</div>
</div>

<div class="artist-box" id="artist2VideoBox">
<div class="artist-label">ARTIST 2</div>
</div>

</div>

<div class="bottom-row">

<div class="panel">
<h3>💬 Live Chat</h3>
<div>Chat system ready.</div>
</div>

<div class="panel">
<h3>🗳 Crowd Voting</h3>
<div>Voting system ready.</div>
</div>

</div>

</div>
</div>

</div>

<script>

function setLiveStatus(text){
    document.getElementById("liveStatus").innerText = text;
}

function joinRole(role){
    setLiveStatus("Joining as " + role + "...");
    console.log("Joining role:", role);
}

function leaveBattle(){
    setLiveStatus("Disconnected");
    console.log("Left battle");
}

</script>

</body>
</html>
